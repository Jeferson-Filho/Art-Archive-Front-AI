version: "3.9"
services:
  api:
    restart: always
    image: "art-archive-api"
    build: ./backend
    ports:
      - "8000:8000"
    network_mode: "host"
    env_file:
      - path: ./backend/.env
  webapp:
    restart: always
    image: "art-archive-webapp"
    build: .
    ports:
      - "3000:3000"
    network_mode: "host"
    env_file:
      - path: .env.production
